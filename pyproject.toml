[project]
name = "aqc4all"
version = "0.1.0"
description = "Aruba QuickConnect for All"
authors = [{ name = "Walter Plinge", email = "walter@plinge.hair" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "selenium",
    "requests",
    "bs4",
    "pyasn1",
    "cryptography",
    "pyotp",
    "pyopenssl",
    "configparser",
]

[project.scripts]
aqc4all = "aqc4all.main:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"
